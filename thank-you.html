<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tack! — GuestFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #0A4F28;
    color: #FFFFFF;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem 1.5rem;
    text-align: center;
  }

  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #C0E8D0;
    margin-bottom: 3rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.1s forwards;
  }

  .checkmark {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(192,232,208,0.15);
    border: 1.5px solid rgba(192,232,208,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 2rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.2s forwards;
  }
  .checkmark svg { stroke: #C0E8D0; }

  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 3rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.3s forwards;
  }
  h1 em { color: #C0E8D0; font-style: italic; }

  p {
    font-size: 1rem;
    line-height: 1.6;
    color: rgba(255,255,255,0.7);
    max-width: 440px;
    margin: 0 auto 2.5rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.4s forwards;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: rgba(192,232,208,0.3);
    margin: 0 auto 2.5rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.5s forwards;
  }

  .detail {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 0.5rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.55s forwards;
  }

  .email {
    font-size: 0.95rem;
    color: #C0E8D0;
    text-decoration: none;
    border-bottom: 1px solid rgba(192,232,208,0.3);
    padding-bottom: 2px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.6s forwards;
  }

  .back {
    margin-top: 3rem;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    transition: color 0.2s;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.7s forwards;
  }
  .back:hover { color: #C0E8D0; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="logo">GuestFlow · Stockholm</div>

<div class="checkmark">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12"></polyline>
  </svg>
</div>

<h1>Bokning bekräftad.<br/><em>Vi ses snart.</em></h1>

<p>Tack för att du bokade en genomgång. Vi hör av oss för att bekräfta tid och förbereda oss på er restaurang.</p>

<div class="divider"></div>

<div class="detail">Frågor? Hör av er direkt</div>
<a class="email" href="mailto:hej@guestflow.se">hej@guestflow.se</a>

<a class="back" href="https://www.guestflow.se">← Tillbaka till guestflow.se</a>

</body>
</html>
